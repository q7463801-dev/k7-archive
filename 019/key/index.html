<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>·</title>
<style>
body{background:#080808;color:#9aa0a6;font:16px/1.7 monospace;padding:20px}
input,button{width:100%;box-sizing:border-box;background:#101010;color:#ccc;
border:1px solid #262626;border-radius:6px;padding:13px;font:inherit;margin:6px 0}
pre{white-space:pre-wrap;color:#7f97a6}
</style>
<input id="t" placeholder="输入">
<button onclick="go(-3)">反向 3</button>
<button onclick="go(3)">正向 3</button>
<pre id="o"></pre>
<script>
function go(k){
  var s=document.getElementById('t').value;
  document.getElementById('o').textContent=s.replace(/[a-z]/gi,function(c){
    var b=c<='Z'?65:97;
    return String.fromCharCode(((c.charCodeAt(0)-b+k)%26+26)%26+b);
  });
}
</script>
